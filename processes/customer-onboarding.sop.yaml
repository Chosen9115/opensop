opensop: "0.1"

process:
  name: customer-onboarding
  version: "1.0"
  description: "Onboard a new business customer for cross-border banking"
  owner: banking-team

  trigger:
    type: api

  inputs:
    - name: company_name
      type: string
      required: true
    - name: contact_email
      type: string
      format: email
      required: true
    - name: country
      type: enum
      values: [US, MX]
      required: true
    - name: source_channel
      type: enum
      values: [website, linkedin, email, referral, cold-outbound]
    - name: deal_id
      type: string
      description: "External CRM reference"

  outputs:
    - name: account_id
      type: string
      from: steps.create-account.outputs.account_id
    - name: member_id
      type: string
      from: steps.create-account.outputs.member_id
    - name: status
      type: enum
      values: [approved, rejected]
      from: steps.submit-to-compliance.outputs.compliance_status
    - name: rejection_reason
      type: string
      from: steps.review-application.outputs.rejection_reason
      required_if: "status == 'rejected'"

  steps:
    - id: collect-business-info
      name: "Collect business information"
      type: form
      description: "Gather company details, ownership, fiscal address"
      inputs:
        - name: company_name
          from: process.inputs.company_name
        - name: contact_email
          from: process.inputs.contact_email
      outputs:
        - name: business_record
          type: object
          schema:
            legal_name: string
            rfc: string
            fiscal_address: string
            industry: string
            annual_revenue: number
      timeout: 7d
      on_timeout: notify-and-wait

    - id: verify-documents
      name: "Verify KYB documents"
      type: automated
      description: "Check uploaded documents against requirements"
      inputs:
        - name: business_record
          from: steps.collect-business-info.outputs.business_record
      outputs:
        - name: verification_result
          type: enum
          values: [complete, incomplete, invalid]
        - name: missing_documents
          type: string[]
      run: ./steps/verify-documents.rb
      retry:
        max: 3
        backoff: exponential

    - id: review-application
      name: "Review application"
      type: judgment
      description: "Assess risk and decide whether to approve"
      inputs:
        - name: business_record
          from: steps.collect-business-info.outputs.business_record
        - name: verification_result
          from: steps.verify-documents.outputs.verification_result
      outputs:
        - name: decision
          type: enum
          values: [approve, reject, request-more-info]
        - name: risk_notes
          type: string
        - name: rejection_reason
          type: string
          required_if: "decision == 'reject'"
      judgment:
        allow_agent: true
        require_human_review: false
        confidence_threshold: 0.9
        escalation: manual

    - id: submit-to-compliance
      name: "Submit to compliance provider"
      type: webhook
      condition: "steps.review-application.outputs.decision == 'approve'"
      inputs:
        - name: business_record
          from: steps.collect-business-info.outputs.business_record
      outputs:
        - name: entity_id
          type: string
        - name: compliance_status
          type: enum
          values: [pending, approved, rejected]
      webhook:
        method: POST
        url: "${COMPLIANCE_PROVIDER_URL}/entities"
        headers:
          Authorization: "Bearer ${COMPLIANCE_API_KEY}"
        response_mode: callback
        callback_path: /sop/webhooks/compliance
        poll_timeout: 7d

    - id: create-account
      name: "Create customer account"
      type: automated
      condition: "steps.submit-to-compliance.outputs.compliance_status == 'approved'"
      inputs:
        - name: business_record
          from: steps.collect-business-info.outputs.business_record
        - name: entity_id
          from: steps.submit-to-compliance.outputs.entity_id
      outputs:
        - name: account_id
          type: string
        - name: member_id
          type: string
      run: ./steps/create-account.rb

    - id: send-welcome
      name: "Send welcome email"
      type: notification
      inputs:
        - name: contact_email
          from: process.inputs.contact_email
        - name: account_id
          from: steps.create-account.outputs.account_id
      outputs:
        - name: email_sent
          type: boolean

  on_error:
    notify:
      channel: slack
      target: "#banking-ops"

  tags: [banking, onboarding, compliance, kyb]
  sla:
    target: 72h
    warning: 48h
