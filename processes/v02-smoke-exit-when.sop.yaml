opensop: "0.2"

process:
  name: v02-smoke-exit-when
  version: "1.0"
  description: "Smoke test for exit_when — terminates early when the score gates fail"
  owner: opensop-core

  trigger:
    type: api

  inputs:
    - name: score
      type: number
      required: true

  outputs:
    - name: outcome
      type: string
      from: steps.finalize.outputs.outcome
    - name: stage_reached
      type: string
      from: steps.finalize.outputs.stage_reached

  steps:
    - id: gate
      name: "Score gate"
      type: automated
      run: steps/v02_echo_score.rb
      inputs:
        - name: score
          from: process.inputs.score
      outputs:
        - { name: score, type: number }
      exit_when: "outputs.score < 0.4"
      exit_outputs:
        outcome: "rejected_low_score"
        stage_reached: "gate"

    - id: enrich
      name: "Enrich (only runs if gate passes)"
      type: automated
      run: steps/v02_echo_score.rb
      inputs:
        - name: score
          from: steps.gate.outputs.score
      outputs:
        - { name: score, type: number }

    - id: finalize
      name: "Finalize"
      type: automated
      run: steps/v02_echo_score.rb
      inputs:
        - name: score
          from: steps.enrich.outputs.score
      outputs:
        - { name: outcome, type: string }
        - { name: stage_reached, type: string }
