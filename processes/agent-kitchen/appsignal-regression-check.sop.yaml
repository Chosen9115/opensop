opensop: "0.1"

process:
  name: appsignal-regression-check
  version: "1.0"
  description: "After a fix PR merges, wait 3 days and check if the error recurred."
  owner: agent-kitchen

  trigger:
    type: api

  inputs:
    - name: incident_id
      type: string
      required: true
    - name: incident_number
      type: number
      required: true
    - name: app_id
      type: string
      required: true
    - name: repo
      type: string
      required: true
    - name: project
      type: string
      required: true
    - name: pr_number
      type: number
      required: true
    - name: merged_at
      type: string
      required: true
      description: "ISO 8601 timestamp when the fix PR merged"

  outputs:
    - name: verdict
      type: string
      from: steps.evaluate-regression.outputs.verdict
    - name: verdict_reason
      type: string
      from: steps.evaluate-regression.outputs.verdict_reason

  steps:
    - id: wait-grace-period
      name: "Wait 3-day grace period"
      type: wait
      wait:
        seconds: 259200
      outputs:
        - name: waited
          type: boolean

    - id: fetch-current-state
      name: "Fetch current incident state"
      type: automated
      inputs:
        - name: incident_id
          from: process.inputs.incident_id
        - name: merged_at
          from: process.inputs.merged_at
      outputs:
        - name: current_last_seen
          type: string
        - name: current_state
          type: string
        - name: current_occurrences_count
          type: number
        - name: days_since_merge
          type: number

    - id: evaluate-regression
      name: "Evaluate regression verdict"
      type: automated
      inputs:
        - name: merged_at
          from: process.inputs.merged_at
        - name: current_last_seen
          from: steps.fetch-current-state.outputs.current_last_seen
        - name: days_since_merge
          from: steps.fetch-current-state.outputs.days_since_merge
      outputs:
        - name: verdict
          type: enum
          values: [fix_verified, regression_detected, deferred_grace]
        - name: verdict_reason
          type: string

    - id: report-outcome
      name: "Report regression outcome"
      type: notification
      condition: "steps.evaluate-regression.outputs.verdict != 'deferred_grace'"
      inputs:
        - name: incident_number
          from: process.inputs.incident_number
        - name: project
          from: process.inputs.project
        - name: verdict
          from: steps.evaluate-regression.outputs.verdict
        - name: verdict_reason
          from: steps.evaluate-regression.outputs.verdict_reason
      outputs:
        - name: notified
          type: boolean

  tags: [agent-kitchen, appsignal, regression-check]
