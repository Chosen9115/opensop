opensop: "0.1"

process:
  name: lead-qualification
  version: "1.0"
  description: "Qualify an inbound lead and score their fit"
  owner: growth-team

  trigger:
    type: api

  inputs:
    - name: lead_name
      type: string
      required: true
    - name: lead_email
      type: string
      format: email
      required: true
    - name: source
      type: enum
      values: [website, linkedin, referral]
      required: true

  outputs:
    - name: score
      type: number
      from: steps.score-lead.outputs.score
    - name: qualified
      type: boolean
      from: steps.score-lead.outputs.qualified

  steps:
    - id: collect-context
      name: "Collect lead context"
      type: form
      description: "Ask the lead (or an agent) for budget, timeline, and notes"
      inputs:
        - name: lead_name
          from: process.inputs.lead_name
      outputs:
        - name: budget
          type: number
        - name: timeline
          type: enum
          values: [immediate, 3m, 6m, unknown]
        - name: notes
          type: string

    - id: score-lead
      name: "Score the lead"
      type: automated
      description: "Compute a qualification score from budget and timeline"
      inputs:
        - name: budget
          from: steps.collect-context.outputs.budget
        - name: timeline
          from: steps.collect-context.outputs.timeline
        - name: notes
          from: steps.collect-context.outputs.notes
      outputs:
        - name: score
          type: number
        - name: qualified
          type: boolean
      run: ./examples/steps/score-lead.rb

    - id: notify-team
      name: "Notify the growth team"
      type: notification
      inputs:
        - name: lead_email
          from: process.inputs.lead_email
        - name: score
          from: steps.score-lead.outputs.score
        - name: qualified
          from: steps.score-lead.outputs.qualified

  tags: [growth, sales, qualification]
