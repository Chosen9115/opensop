opensop: "0.1"

# PRIVATE — Coba fork only. Never pushed to Chosen9115/opensop.
#
# One instance per Cal.com booking, regardless of which Cal.com event
# type (cold-prospect 15-min OR website-discovery 15-min) fired the
# webhook. Cal.com posts BOOKING_CREATED → HMAC-verified → CRM upsert.
#
# CRITICAL DESIGN RULE (Carlos, 2026-04-29): NO EMAIL SEND HERE. The
# booker has already chosen a meeting time. Sending another "schedule a
# call" email would be wrong and confusing. The only outbound email in
# Coba's lead funnel is the discovery-call invite from the
# website-lead-capture flow (Web3Forms intake → triage → email after
# 10-min delay). Once a booking happens, this process is just CRM
# bookkeeping.
#
# DenchClaw is idempotent on email, so when a booking comes in for a
# person already created by website-lead-capture, the existing deal is
# located and a touch-block is appended instead of a dupe being made.
#
# Removed in v1.1 (2026-04-29):
#   - send-confirmation  (notification stub, would have sent unwanted email)
#   - wait-for-meeting   (1h fixed delay, then hung at the next step)
#   - record-outcome     (human form, sat unfilled forever)
#   - route              (judgment, needed an LLM key we don't have on Fly)
# Post-meeting work now lives in `consult-meeting-outcome` (separate
# process, started manually after the call via Hermes).

process:
  name: consult-request
  version: "1.1"
  description: "Cal.com booking → CRM upsert. No email. Post-meeting work lives in consult-meeting-outcome."
  owner: growth-team

  trigger:
    type: webhook
    auth:
      scheme: hmac-sha256
      secret_env: CAL_WEBHOOK_SECRET
      header: X-Cal-Signature-256
      encoding: hex
    input_mapping:
      # Cal.com's BOOKING_CREATED payload shape. Fields confirmed present:
      #   payload.title          — meeting title (NOT nested under eventType)
      #   payload.startTime      — ISO 8601
      #   payload.endTime        — ISO 8601
      #   payload.uid            — unique booking ID (absent in ping payload)
      #   payload.attendees[0]   — array, first entry is the booker
      attendee_email:  "${payload.payload.attendees.0.email}"
      attendee_name:   "${payload.payload.attendees.0.name}"
      meeting_time:    "${payload.payload.startTime}"
      meeting_end:     "${payload.payload.endTime}"
      event_type:      "${payload.payload.title}"
      booking_id:      "${payload.payload.uid}"
      source:          "cal.com"

  inputs:
    - name: attendee_email
      type: string
      format: email
      required: true
    - name: attendee_name
      type: string
      required: true
    - name: meeting_time
      type: string
      required: true
      description: "ISO 8601 start time"
    - name: meeting_end
      type: string
      description: "ISO 8601 end time"
    - name: event_type
      type: string
    - name: booking_id
      type: string
      required: true
      description: "Cal.com uid — unique per booking; use for dedup downstream"
    - name: source
      type: string
    - name: lead_volume
      type: string
      description: "Answer to the 'monthly cross-border volume' question, if filled"

  outputs:
    - name: crm_deal_id
      from: steps.create-crm-record.outputs.deal_id
    - name: crm_person_id
      from: steps.create-crm-record.outputs.person_id
    - name: was_duplicate
      from: steps.create-crm-record.outputs.was_duplicate

  steps:
    # ─── 1. Create CRM record in DenchClaw ──────────────────────────
    - id: create-crm-record
      name: "Insert lead into DenchClaw"
      type: webhook
      description: "Outbound POST to the DenchClaw bridge on the laptop (via Tailscale Funnel). Inserts v_people + v_deal rows. Idempotent on email."
      inputs:
        - name: lead_email
          from: process.inputs.attendee_email
        - name: lead_name
          from: process.inputs.attendee_name
        - name: lead_title
          from: process.inputs.event_type
        - name: source
          from: process.inputs.source
        - name: platform_campaign_id
          from: process.inputs.booking_id
      webhook:
        method: POST
        url: "${env.DENCHCLAW_BRIDGE_URL}/leads"
        headers:
          Authorization: "Bearer ${env.DENCHCLAW_BRIDGE_TOKEN}"
          Content-Type: "application/json"
        response_mode: sync
      outputs:
        - name: person_id
          type: string
        - name: deal_id
          type: string
        - name: was_duplicate
          type: boolean

  # Process ends after CRM upsert. Post-meeting work — Circleback
  # enrichment, LLM outcome proposal, routing — lives in the separate
  # `consult-meeting-outcome` process (started manually after the call
  # via Hermes; see hermes-os/scripts/run_consult_outcome.py).

  on_error:
    notify:
      channel: slack
      target: "#growth-alerts"

  tags: [growth, consult, cal-com, logistics]
