opensop: "0.2"

process:
  name: v02-smoke-loop-llm
  version: "1.0"
  description: "Smoke test for loop step with an llm body — classifies each item in a list"
  owner: opensop-core

  trigger:
    type: api

  inputs:
    - name: messages
      type: object
      required: true
      description: "Array of { id, text } items to classify"

  outputs:
    - name: classifications
      from: steps.classify-each.outputs.classifications

  steps:
    - id: source
      name: "Source the messages"
      type: automated
      run: steps/v02_passthrough_messages.rb
      inputs:
        - name: messages
          from: process.inputs.messages
      outputs:
        - name: messages
          type: object
          collection: true
          item_schema:
            id: string
            text: string

    - id: classify-each
      name: "Classify each message"
      type: loop
      loop:
        for_each: steps.source.outputs.messages[*]
        as: msg
        aggregate:
          classifications: concat
      body:
        - id: classify
          name: "Classify one message"
          type: llm
          model: claude-sonnet-4-7
          prompt: |
            Classify this message as one of: question, task, complaint.
            Return JSON only.
            Message: {{ msg }}
          tools: []
          expected_output_schema:
            intent: enum[question, task, complaint]
            confidence: number
          inputs:
            - name: msg
              from: loop.msg
          outputs:
            - { name: intent, type: enum, values: [question, task, complaint] }
            - { name: confidence, type: number }
      outputs:
        - name: classifications
          type: object
          collection: true
          item_schema:
            intent: string
            confidence: number
