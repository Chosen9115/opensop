        copied: "Copied"
        path_params: "Path parameters"
        request_body: "Request body"
        response: "Response"
        errors_heading: "Errors"

      guides:
        quickstart:
          label: "Quickstart"
          title: "Quickstart"
          subtitle: "From zero to a running process instance in under five minutes."
          what_you_build:
            heading: "What you'll build"
            body_html: "A trivial process called <code class=\"font-mono text-[11px] bg-[#eef0f3] px-1 py-0.5 rounded-[3px]\">hello-world</code> that takes one input and returns one output. You'll <strong>register</strong> it from YAML, <strong>start</strong> an instance via the API, and read the result back."
          prereq_html: "An OpenSOP engine reachable at <code class=\"font-mono text-[11px] bg-[#eef0f3] px-1 py-0.5 rounded-[3px]\">https://api.opensop.dev</code> and a workspace token. Set <code class=\"font-mono text-[11px] bg-[#eef0f3] px-1 py-0.5 rounded-[3px]\">export OPENSOP_TOKEN=sk_…</code> before running the snippets below."
          step_1:
            heading: "Write the YAML"
            body: "Save this as hello-world.yaml:"
          step_2:
            heading: "Register the process"
            body: "Upload the YAML via multipart POST:"
          step_3:
            heading: "Start an instance"
            body: "POST to start with inputs:"
          step_4:
            heading: "Poll for completion"
            body_html: "Read <code class=\"font-mono text-[11px] bg-[#eef0f3] px-1 py-0.5 rounded-[3px]\">state</code> from <code class=\"font-mono text-[11px] bg-[#eef0f3] px-1 py-0.5 rounded-[3px]\">GET /sop/hello-world/:id</code> until it is <code class=\"font-mono text-[11px] bg-[#eef0f3] px-1 py-0.5 rounded-[3px]\">completed</code> or <code class=\"font-mono text-[11px] bg-[#eef0f3] px-1 py-0.5 rounded-[3px]\">failed</code>."
          lifecycle:
            heading: "Lifecycle"
          next_steps:
            heading: "Next steps"
            judgment_html: "Add a <code class=\"font-mono text-[11px] bg-[#eef0f3] px-1 py-0.5 rounded-[3px]\">judgment</code> step with <code class=\"font-mono text-[11px] bg-[#eef0f3] px-1 py-0.5 rounded-[3px]\">allow_agent: true</code> to let an LLM decide."
            webhook_html: "Add a <code class=\"font-mono text-[11px] bg-[#eef0f3] px-1 py-0.5 rounded-[3px]\">webhook</code> step to wait on a third party (Stripe, DocuSign, internal service)."
            polling: "Replace polling with an outbound webhook on state_changed."

        authentication:
          label: "Authentication"
          title: "Authentication"
          subtitle: "Three auth modes, one for each direction traffic flows."
          outbound:
            heading: "1 · Outbound calls — bearer token"
            body_html: "Every request to the OpenSOP API except <code class=\"font-mono text-[11px] bg-[#eef0f3] px-1 py-0.5 rounded-[3px]\">/sop/triggers/*</code> and <code class=\"font-mono text-[11px] bg-[#eef0f3] px-1 py-0.5 rounded-[3px]\">/sop/webhooks/*</code> requires an <code class=\"font-mono text-[11px] bg-[#eef0f3] px-1 py-0.5 rounded-[3px]\">X-SOP-Token</code> header. Tokens are workspace-scoped."
          inbound:
            heading: "2 · Inbound triggers — HMAC"
            body_html: "Endpoints under <code class=\"font-mono text-[11px] bg-[#eef0f3] px-1 py-0.5 rounded-[3px]\">/sop/triggers/:process_name</code> have no bearer token. Instead, the third party signs the raw request body with a shared secret. The engine looks up the secret declared at <code class=\"font-mono text-[11px] bg-[#eef0f3] px-1 py-0.5 rounded-[3px]\">process.trigger.auth.secret_env</code>, recomputes the signature, and compares constant-time."
            callout: "Provider signature schemes vary — different headers, encodings (hex / base64), and prefixes. See the provider matrix on the trigger endpoint page."
          callback:
            heading: "3 · Webhook callbacks — single-use ID"
            body: "When a webhook step starts, the engine generates a callback URL containing a one-shot ULID. The third party POSTs back to that URL. The ID itself is the credential — once consumed, it is invalidated."
            expiry_html: "Callback URLs expire after the step's <code class=\"font-mono text-[11px] bg-[#eef0f3] px-1 py-0.5 rounded-[3px]\">timeout</code>, default 7 days."
          rotation:
            heading: "Token rotation"
            col_action: "Action"
            col_endpoint: "Endpoint"
            create: "Create token"
            create_endpoint: "POST /workspace/tokens"
            list: "List active tokens"
            list_endpoint: "GET /workspace/tokens"
            revoke: "Revoke token"
            revoke_endpoint: "DELETE /workspace/tokens/:id"

        process_format:
          label: "Process format"
          title: "Process format"
          subtitle: "The YAML schema every process is written in. Stable from opensop: \"0.1\" onward."
          anatomy:
            heading: "Anatomy"
          step_types:
            heading: "Step types"
            col_type: "Type"
            col_resolved_by: "Resolved by"
            col_notes: "Notes"
            form: "form"
            form_resolved: "human"
            form_notes: "Collects structured inputs. Use for kickoff and HITL."
            automated: "automated"
            automated_resolved: "worker"
            automated_notes: "An external worker polls /steps/pending and submits outputs."
            judgment: "judgment"
            judgment_resolved: "agent or human"
            judgment_notes: "If allow_agent: true, an LLM decides. Below the confidence threshold, escalates."
            webhook: "webhook"
            webhook_resolved: "third party"
            webhook_notes: "Engine creates a callback URL; the step waits until something POSTs to it."
          references:
            heading: "References"
            body_html: "Anywhere a value is expected, you can use the <code class=\"font-mono text-[11px] bg-[#eef0f3] px-1 py-0.5 rounded-[3px]\">${...}</code> syntax to pull from upstream context:"

        errors:
          label: "Errors"
          title: "Errors"
          subtitle: "Every error is JSON with a stable code field — safe to switch on."
          shape:
            heading: "Shape"
          status_codes:
            heading: "Status codes"
            col_status: "Status"
            col_code: "Code"
            col_meaning: "Meaning"
          retries:
            heading: "Retries"
            body_html: "The engine itself retries failed <code class=\"font-mono text-[11px] bg-[#eef0f3] px-1 py-0.5 rounded-[3px]\">automated</code> steps with exponential backoff (max 3 attempts by default). The API does not retry your inbound calls — wrap idempotent calls (<code class=\"font-mono text-[11px] bg-[#eef0f3] px-1 py-0.5 rounded-[3px]\">POST /start</code>, <code class=\"font-mono text-[11px] bg-[#eef0f3] px-1 py-0.5 rounded-[3px]\">POST /submit</code>) yourself."

        versioning:
          label: "Versioning"
          title: "Versioning"
          subtitle: "Two version axes — the API itself, and individual processes — evolve independently."
          api_version:
            heading: "API version"
            body: "The wire format is identified by the top-level opensop: field on every process YAML. The engine refuses to register YAML whose major version it does not understand."
            col_version: "Version"
            col_status: "Status"
            col_notes: "Notes"
            v01_notes: "Initial public release."
            v02_notes: "Configurable metrics window, parallel step blocks."
          process_versions:
            heading: "Process versions"
            semver_html: "Every process has its own semver-style <code class=\"font-mono text-[11px] bg-[#eef0f3] px-1 py-0.5 rounded-[3px]\">version</code> string. Re-publishing under a new version does not affect in-flight instances — they continue running against the version they started under."
            pin_html: "When you call <code class=\"font-mono text-[11px] bg-[#eef0f3] px-1 py-0.5 rounded-[3px]\">GET /sop/:name/schema</code> without <code class=\"font-mono text-[11px] bg-[#eef0f3] px-1 py-0.5 rounded-[3px]\">?version=</code>, you get the latest published version. To pin, pass it explicitly."

      endpoints:
        list_processes:
          title: "List all processes"
          description: "Returns every published process definition in the workspace. Use this for discovery — agents call this endpoint to learn what processes are available before starting an instance."
        process_schema:
          title: "Get process schema"
          description: "Returns the full YAML-parsed definition of a process. Useful for inspecting inputs, outputs, and steps before starting an instance. Defaults to the latest published version."
        register_process:
          title: "Register a process"
          description: "Upload a .sop.yaml file to register or update a process definition. If a process with the same name already exists, a new version is published. In-flight instances are unaffected."
        list_instances:
          title: "List all instances"
          description: "Returns a paginated list of instances across all processes. Filter by process name or state to narrow results."
        start_instance:
          title: "Start an instance"
          description_html: "Creates a new instance of the named process and begins execution. Pass all required inputs in the JSON body. The engine validates inputs against the process schema and returns <code class=\"font-mono text-[11px] bg-[#eef0f3] px-1 py-0.5 rounded-[3px]\">422</code> if any required field is missing or fails validation."
        show_instance:
          title: "Get instance state"
          description: "Returns the current state of a process instance — inputs, outputs, current state, and a summary of each step's status."
        cancel_instance:
          title: "Cancel an instance"
          description_html: "Terminates a running instance immediately. The instance moves to the <code class=\"font-mono text-[11px] bg-[#eef0f3] px-1 py-0.5 rounded-[3px]\">cancelled</code> state. Any pending steps are skipped. This action is irreversible."
        list_steps:
          title: "List steps"
          description: "Returns the state of every step in a process instance. Useful for tracking progress, debugging failures, and building status UIs."
        submit_step:
          title: "Submit a step"
          description_html: "Advances a step by providing its outputs. The step must be in the <code class=\"font-mono text-[11px] bg-[#eef0f3] px-1 py-0.5 rounded-[3px]\">active</code> state. Submitting a terminal step or a step in the wrong state returns <code class=\"font-mono text-[11px] bg-[#eef0f3] px-1 py-0.5 rounded-[3px]\">422 invalid_transition</code>."
        pending_steps:
          title: "List pending steps"
          description_html: "Returns all steps across all instances that are in the <code class=\"font-mono text-[11px] bg-[#eef0f3] px-1 py-0.5 rounded-[3px]\">active</code> state and of type <code class=\"font-mono text-[11px] bg-[#eef0f3] px-1 py-0.5 rounded-[3px]\">automated</code>. External workers poll this endpoint to discover work."
        fire_trigger:
          title: "Fire a trigger"
          description: "Starts a new process instance via an inbound webhook trigger. No bearer token required — auth is HMAC-based. The raw request body is signed by the third party using the shared secret declared in the process definition."
        deliver_callback:
          title: "Deliver a webhook callback"
          description: "POSTs back to a one-shot callback URL generated by the engine when a webhook step starts. The ULID in the path is the credential. Once consumed, the URL is invalidated and subsequent calls return 409."
        show_metrics:
          title: "Get metrics"
          description: "Returns aggregate throughput and success metrics for all processes over the last 24 hours."

      auth:
        heading: "Authentication"
        header_intro_html: "Every request to <code class=\"font-mono text-[12px] bg-bg-pill px-1 py-0.5 rounded-[3px]\">/sop/*</code> must include the <code class=\"font-mono text-[12px] bg-bg-pill px-1 py-0.5 rounded-[3px]\">X-SOP-Token</code> header."
        env_intro_html: "The expected token is read from the <code class=\"font-mono text-[12px] bg-bg-pill px-1 py-0.5 rounded-[3px]\">OPENSOP_API_TOKEN</code> environment variable."
        fallback: "If OPENSOP_API_TOKEN is unset, the engine falls back to no-auth (intended for local development and tests). Set the variable in any deployment that should be locked down."
      snippets:
        heading: "Snippet library"
        intro: "Copy-paste examples for the two most common flows."
