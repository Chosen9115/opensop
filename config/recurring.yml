production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  demo_reset:
    class: Demo::ResetJob
    schedule: "0 3 * * *"
    description: "Reset demo data daily at 3:00 UTC. No-op outside DEMO_MODE."

development:
  demo_reset:
    class: Demo::ResetJob
    schedule: "0 3 * * *"
    description: "Reset demo data daily at 3:00 UTC. No-op outside DEMO_MODE."
