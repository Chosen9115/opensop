version: 1
swarm:
  name: "OpenSOP Development Team"
  main: architect
  instances:
    architect:
      description: "OpenSOP architect coordinating full-stack development"
      directory: .
      model: opus
      connections: [models, database, controllers, views, stimulus, tailwind, services, jobs, tests, i18n, devops, security, documentation]
      prompt_file: .claude-on-rails/prompts/architect.md
      vibe: true

    models:
      description: "ActiveRecord models, associations, validations, and migrations specialist"
      directory: ./app/models
      model: opus
      connections: [database]
      allowed_tools: [Read, Edit, Write, Bash, Grep, Glob, LS]
      prompt_file: .claude-on-rails/prompts/models.md

    database:
      description: "Database schema design, query optimization, and N+1 detection specialist"
      directory: .
      model: opus
      allowed_tools: [Read, Bash, Grep, Glob, LS]
      prompt_file: .claude-on-rails/prompts/database.md

    controllers:
      description: "Rails controllers, routing, and request handling specialist"
      directory: ./app/controllers
      model: opus
      connections: [services]
      allowed_tools: [Read, Edit, Write, Bash, Grep, Glob, LS]
      prompt_file: .claude-on-rails/prompts/controllers.md

    views:
      description: "Rails views, layouts, partials, ViewComponent, and asset pipeline specialist"
      directory: ./app/views
      model: opus
      connections: [stimulus, tailwind, i18n]
      allowed_tools: [Read, Edit, Write, Bash, Grep, Glob, LS]
      prompt_file: .claude-on-rails/prompts/views.md

    stimulus:
      description: "Stimulus.js controllers and Turbo integration specialist"
      directory: ./app/javascript
      model: opus
      allowed_tools: [Read, Edit, Write, Bash, Grep, Glob, LS]
      prompt_file: .claude-on-rails/prompts/stimulus.md

    tailwind:
      description: "Tailwind CSS styling, responsive design, and Rails frontend integration specialist"
      directory: .
      model: opus
      allowed_tools: [Read, Edit, Write, Bash, Grep, Glob, LS]
      prompt_file: .claude-on-rails/prompts/tailwind.md

    services:
      description: "Service objects, business logic, process engine, and step executors specialist"
      directory: ./app/services
      model: opus
      allowed_tools: [Read, Edit, Write, Bash, Grep, Glob, LS]
      prompt_file: .claude-on-rails/prompts/services.md

    jobs:
      description: "Background jobs, ActiveJob, and async processing specialist"
      directory: ./app/jobs
      model: opus
      allowed_tools: [Read, Edit, Write, Bash, Grep, Glob, LS]
      prompt_file: .claude-on-rails/prompts/jobs.md

    tests:
      description: "RSpec testing, factories, and test coverage specialist"
      directory: ./spec
      model: opus
      allowed_tools: [Read, Edit, Write, Bash, Grep, Glob, LS]
      prompt_file: .claude-on-rails/prompts/tests.md

    i18n:
      description: "Rails internationalization, localization, and translation specialist"
      directory: ./config/locales
      model: opus
      allowed_tools: [Read, Edit, Write, Bash, Grep, Glob, LS]
      prompt_file: .claude-on-rails/prompts/i18n.md

    devops:
      description: "Deployment, Docker, CI/CD, GCP Cloud Run configuration specialist"
      directory: ./config
      model: opus
      allowed_tools: [Read, Edit, Write, Bash, Grep, Glob, LS]
      prompt_file: .claude-on-rails/prompts/devops.md

    security:
      description: "Application security auditing specialist"
      directory: .
      model: opus
      connections: [models, controllers, views]
      allowed_tools: [Read, Edit, Write, Bash, Grep, Glob, LS]
      prompt_file: .claude-on-rails/prompts/security.md

    documentation:
      description: "API documentation, YARD docs, and project documentation specialist"
      directory: .
      model: opus
      connections: [models, controllers]
      allowed_tools: [Read, Edit, Write, Bash, Grep, Glob, LS]
      prompt_file: .claude-on-rails/prompts/documentation.md
