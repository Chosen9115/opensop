# fly.toml app configuration file generated for opensop on 2026-04-24T10:56:39-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'opensop'
primary_region = 'dfw'

[deploy]
  release_command = './bin/rails db:prepare'

[env]
  HTTP_PORT = '3000'
  RAILS_ENV = 'production'
  RAILS_LOG_TO_STDOUT = 'true'
  SOLID_QUEUE_IN_PUMA = 'true'
  TARGET_PORT = '3001'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/up'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
